services:
  - type: web
    name: voice-calendar-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run server:build
    startCommand: npm run server:start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CORS_ALLOWED_ORIGINS
        value: https://1483636995-create.github.io
      - key: EVENT_DATA_FILE
        value: /var/data/events.json
      - key: API_KEY
        sync: false
    disk:
      name: event-data
      mountPath: /var/data
      sizeGB: 1
